name: mintmap
owner: inforbio
description: Identify and quantify tRNA-derived fragments from small RNA-seq data
long_description: >-
  Galaxy wrapper for MINTmap, which identifies and quantifies tRNA-derived
  fragments (tRFs) from small RNA sequencing datasets and reports exclusive
  and ambiguous tRF expression profiles.
